<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4ade80"/>
    </marker>
    <style>
      .t  { font-family: 'Noto Sans', sans-serif; fill: #f8fafc; }
      .m  { font-family: 'JetBrainsMono NF', 'DejaVu Sans Mono', monospace; }
      .card { fill: #111c33; stroke: #334155; stroke-width: 2; }
      .h  { font-family: 'Noto Sans', sans-serif; font-weight: 700; font-size: 30px; fill: #f8fafc; }
      .s  { font-family: 'JetBrainsMono NF', monospace; font-size: 20px; fill: #94a3b8; }
      .lbl{ font-family: 'Noto Sans', sans-serif; font-weight: 600; font-size: 21px; fill: #e2e8f0; }
      .n  { font-family: 'Noto Sans', sans-serif; font-weight: 800; font-size: 20px; fill: #0b1220; }
      .flow { stroke: #e2e8f0; stroke-width: 3; fill: none; marker-end: url(#a); }
    </style>
  </defs>

  <rect width="1080" height="1350" fill="#0b1220"/>

  <!-- headline -->
  <text x="60" y="88" class="m" font-size="22" font-weight="700" fill="#ff9900" letter-spacing="3">KUBERNETES × AWS SECRETS</text>
  <text x="60" y="168" class="t" font-size="62" font-weight="800">Your app never talks to AWS.</text>
  <text x="60" y="222" class="t" font-size="27" fill="#94a3b8" style="fill:#94a3b8">How External Secrets Operator + EKS Pod Identity</text>
  <text x="60" y="258" class="t" font-size="27" style="fill:#94a3b8">deliver a Secrets Manager secret into a pod.</text>

  <!-- AWS boundary -->
  <rect x="40" y="310" width="1000" height="250" rx="22" fill="none" stroke="#ff9900" stroke-width="2.5" stroke-dasharray="10 8"/>
  <rect x="64" y="296" width="78" height="30" rx="6" fill="#0b1220"/>
  <text x="72" y="320" class="m" font-size="22" font-weight="700" fill="#ff9900">AWS</text>

  <rect x="80" y="360" width="400" height="160" rx="16" class="card" style="stroke:#ff9900"/>
  <text x="108" y="410" class="h">IAM role</text>
  <text x="108" y="448" class="s" style="fill:#fbbf24">ESO-Secrets-Reader</text>
  <text x="108" y="484" class="s">read my-app/* only</text>

  <rect x="600" y="360" width="400" height="160" rx="16" class="card" style="stroke:#ff9900"/>
  <text x="628" y="410" class="h">Secrets Manager</text>
  <text x="628" y="448" class="s" style="fill:#fbbf24">my-app/database</text>
  <text x="628" y="484" class="s">the vault</text>

  <!-- EKS boundary -->
  <rect x="40" y="620" width="1000" height="610" rx="22" fill="none" stroke="#326ce5" stroke-width="2.5" stroke-dasharray="10 8"/>
  <rect x="64" y="606" width="168" height="30" rx="6" fill="#0b1220"/>
  <text x="72" y="630" class="m" font-size="22" font-weight="700" fill="#60a5fa">EKS CLUSTER</text>

  <rect x="80" y="670" width="400" height="150" rx="16" class="card" style="stroke:#60a5fa"/>
  <text x="108" y="720" class="h">Pod Identity Agent</text>
  <text x="108" y="758" class="s">DaemonSet, every node</text>
  <text x="108" y="792" class="s">the ID card office</text>

  <rect x="600" y="670" width="400" height="150" rx="16" class="card" style="stroke:#60a5fa"/>
  <text x="628" y="720" class="h">ESO pod</text>
  <text x="628" y="758" class="s" style="fill:#93c5fd">sa: external-secrets</text>
  <text x="628" y="792" class="s">the courier</text>

  <rect x="600" y="910" width="400" height="140" rx="16" class="card" style="stroke:#60a5fa"/>
  <text x="628" y="960" class="h">K8s Secret</text>
  <text x="628" y="998" class="s" style="fill:#93c5fd">database-secret</text>
  <text x="628" y="1030" class="s">the locker</text>

  <rect x="80" y="1060" width="400" height="140" rx="16" fill="#0f2a1d" stroke="#4ade80" stroke-width="2.5"/>
  <text x="108" y="1110" class="h">App pod</text>
  <text x="108" y="1148" class="s" style="fill:#4ade80">no IAM role</text>
  <text x="108" y="1180" class="s" style="fill:#4ade80">no AWS keys</text>

  <!-- 0: role assigned via association -->
  <path d="M280,520 L280,662" stroke="#ff9900" stroke-width="3" stroke-dasharray="7 6" fill="none" marker-end="url(#a)"/>
  <text x="296" y="582" class="lbl" style="fill:#fbbf24">Pod Identity</text>
  <text x="296" y="608" class="lbl" style="fill:#fbbf24">association</text>

  <!-- 1: temp creds -->
  <path d="M480,745 L592,745" class="flow"/>
  <circle cx="536" cy="710" r="17" fill="#ff9900"/><text x="530" y="717" class="n">1</text>
  <text x="494" y="784" class="lbl" font-size="18" style="font-size:18px">temp creds</text>

  <!-- 2: fetch -->
  <path d="M800,670 L800,528" class="flow"/>
  <circle cx="770" cy="598" r="17" fill="#ff9900"/><text x="764" y="605" class="n">2</text>
  <text x="818" y="600" class="lbl">GetSecretValue</text>

  <!-- 3: create + refresh -->
  <path d="M800,820 L800,902" class="flow"/>
  <circle cx="770" cy="861" r="17" fill="#ff9900"/><text x="764" y="868" class="n">3</text>
  <text x="818" y="856" class="lbl">create +</text>
  <text x="818" y="882" class="lbl">refresh every 1h</text>

  <!-- 4: app reads -->
  <path d="M600,980 L540,980 Q520,980 520,1000 L520,1130 L488,1130" stroke="#4ade80" stroke-width="3" fill="none" marker-end="url(#ag)"/>
  <circle cx="555" cy="1050" r="17" fill="#4ade80"/><text x="549" y="1057" class="n">4</text>
  <text x="586" y="1110" class="lbl" style="fill:#4ade80">reads DB_PASSWORD</text>
  <text x="586" y="1136" class="lbl" style="fill:#4ade80">as a normal env var</text>

  <!-- footer -->
  <text x="60" y="1290" class="t" font-size="24" style="fill:#94a3b8">Vault: Secrets Manager · Courier: ESO · Locker: K8s Secret</text>
</svg>
